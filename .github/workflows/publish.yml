name: Publish npm

on:
  push:
    branches: [main]
    paths:
      - "src/components/**"
      - "src/styles/**"
      - "src/index.ts"
      - "src/hooks/**"
      - "src/theme/**"
      - "src/build-styles.ts"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip publish]')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run prepublishOnly

      - name: Bump patch when this version is already on npm
        if: github.event_name == 'push'
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "@iantroisi/ui@${LOCAL}" version >/dev/null 2>&1; then
            echo "v${LOCAL} is already published; bumping patch"
            npm version patch --no-git-tag-version
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          if git diff --quiet package.json; then
            echo "No version change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: release v${VERSION} [skip publish]"
          git push
